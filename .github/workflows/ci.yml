name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: sam
          POSTGRES_PASSWORD: sam
          POSTGRES_DB: sam
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U sam"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://sam:sam@localhost:5432/sam?schema=public
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run db:deploy
      - run: npm run db:seed
      - run: npm test
      - run: npm run build
