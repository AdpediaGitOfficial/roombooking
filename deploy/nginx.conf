# /etc/nginx/sites-available/staff-accommodation
# TLS in front of the app. Obtain the certificate with
# `certbot --nginx -d accommodation.example.com` after enabling this site.
server {
    listen 80;
    server_name accommodation.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name accommodation.example.com;

    ssl_certificate     /etc/letsencrypt/live/accommodation.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/accommodation.example.com/privkey.pem;

    client_max_body_size 10m;   # photo uploads (MAX_UPLOAD_BYTES is 5 MB by default)

    location / {
        proxy_pass         http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
