# Render blueprint: https://render.com/docs/blueprint-spec
# Creates the three services and the database from this repository:
#   staff-accommodation-db   PostgreSQL
#   staff-accommodation-api  private service (API + uploaded photos on a disk)
#   staff-accommodation      public web app, calls the API over the private network
#   staff-accommodation-worker  background worker (email, WhatsApp, sweeps)
# See docs/deployment.md for the same layout on a plain Linux server.
databases:
  - name: staff-accommodation-db
    databaseName: sam
    user: sam
    plan: basic-256mb

services:
  - type: pserv
    name: staff-accommodation-api
    runtime: node
    plan: starter
    buildCommand: npm ci && npm run build
    preDeployCommand: npm run db:deploy
    startCommand: npm run start:api
    healthCheckPath: /ready
    autoDeploy: true
    disk:
      name: uploads
      mountPath: /var/data/uploads
      sizeGB: 5
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: API_PORT
        value: "10000"
      - key: DATABASE_URL
        fromDatabase:
          name: staff-accommodation-db
          property: connectionString
      - key: UPLOAD_DIR
        value: /var/data/uploads
      - key: APP_BASE_URL
        fromService:
          type: web
          name: staff-accommodation
          envVarKey: RENDER_EXTERNAL_URL
      - key: JOBS_SECRET
        generateValue: true
      - key: WHATSAPP_VERIFY_TOKEN
        sync: false
      - key: WHATSAPP_APP_SECRET
        sync: false
      - key: DEFAULT_COUNTRY_CODE     # lets residents enter local phone numbers; same value as the worker
        sync: false

  - type: web
    name: staff-accommodation
    runtime: node
    plan: starter
    buildCommand: npm ci && npm run build
    startCommand: npm run start:web
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: API_URL
        fromService:
          type: pserv
          name: staff-accommodation-api
          property: hostport
      - key: JOBS_SECRET
        fromService:
          type: pserv
          name: staff-accommodation-api
          envVarKey: JOBS_SECRET

  # Delivers email and WhatsApp messages and runs the booking and request sweeps.
  # Keep this at exactly one instance.
  - type: worker
    name: staff-accommodation-worker
    runtime: node
    plan: starter
    buildCommand: npm ci && npm run build
    startCommand: npm run start:worker
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: staff-accommodation-db
          property: connectionString
      - key: APP_BASE_URL
        fromService:
          type: web
          name: staff-accommodation
          envVarKey: RENDER_EXTERNAL_URL
      # Fill these in the Render dashboard after the first deploy.
      - key: MAIL_FROM
        value: "Staff Accommodation <no-reply@example.com>"
      - key: EMAIL_TRANSPORT
        value: log            # change to smtp once SMTP_* are set
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: WHATSAPP_TRANSPORT
        value: disabled       # change to meta once the WHATSAPP_* values are set
      - key: WHATSAPP_ACCESS_TOKEN
        sync: false
      - key: WHATSAPP_PHONE_NUMBER_ID
        sync: false
      - key: DEFAULT_COUNTRY_CODE
        sync: false
